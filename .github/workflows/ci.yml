name: CI


permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/**

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  NET_RETRY_COUNT: 5
  DOCBOOK_XSL_DIR: /usr/share/xml/docbook/stylesheet/docbook-xsl
  DOCBOOK_DTD_DIR: /usr/share/xml/docbook/schema/dtd/4.2

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Formatting
      uses: DoozyX/clang-format-lint-action@bcb4eb2cb0d707ee4f3e5cc3b456eb075f12cf73 # v0.20
      with:
        clangFormatVersion: 10

  call-boost-ci:
    name: Run Build
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    with:
      library_folder: turtle
      b2_targets: "libs/turtle/test libs/turtle/doc//mock_examples"
      branch_coverage: false
      coverage_service: coveralls
      enable_cmake: false
      enable_32bit: false
      enable_multiarch: false
      enable_reflection: false
      exclude_compiler: gcc-4.4,gcc-4.6,gcc-4.7,gcc-4.8,gcc-4.9,gcc-5,gcc-6,clang-3.5,clang-3.6,clang-3.7,clang-3.8,clang-3.9,clang-4.0,clang-5.0,clang-6.0
      exclude_cxxstd: 98,03,0x,11

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: boostorg/boost
        ref: master
        path: boost-root
        submodules: false
    - name: Install packages
      run: sudo apt-get -o Acquire::Retries=3 install -y xsltproc docbook-xsl docbook-xml
    - name: Init submodules for doc build
      working-directory: boost-root
      run: |
        git submodule update -q --init tools/boostdep tools/boostbook tools/quickbook tools/inspect
        python tools/boostdep/depinst/depinst.py ../tools/boostbook
        python tools/boostdep/depinst/depinst.py ../tools/quickbook
        python tools/boostdep/depinst/depinst.py ../tools/inspect
        # Move the Boost root to a sibling folder to avoid that inspect runs on entire Boost too
        BOOST_ROOT="${{github.workspace}}/../boost-root"
        mv ../boost-root "$BOOST_ROOT"
        echo "BOOST_ROOT=$BOOST_ROOT" >> $GITHUB_ENV
    - name: Bootstrap b2
      working-directory:  ${{env.BOOST_ROOT}}
      run: ./bootstrap.sh
    - name: Build doc
      run: scripts/build_doc.sh
    - name: Build and run inspect
      working-directory: ${{env.BOOST_ROOT}}
      run: ./b2 "$GITHUB_WORKSPACE/test//inspect" -q

  CMake:
    defaults:
      run:
        shell: bash

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - {os: windows-2022, toolset: msvc-14.3, cxxstd: 20, boostBranch: boost-1.78.0, generator: 'Visual Studio 17 2022'}
          - {os: windows-2022, toolset: msvc-14.3, cxxstd: 20, boostBranch: master,       generator: 'Visual Studio 17 2022'}
          # MinGW
          - {os: windows-2022, toolset: gcc,       cxxstd: 17, boostBranch: boost-1.86.0, generator: 'MinGW Makefiles'}
          - {os: windows-2022, toolset: gcc,       cxxstd: 17, boostBranch: master,       generator: 'MinGW Makefiles'}
          # GCC
          - {os: ubuntu-22.04, toolset: gcc,       cxxstd: 14, boostBranch: boost-1.63.0}
          - {os: ubuntu-22.04, toolset: gcc,       cxxstd: 14, boostBranch: master}
          # Clang
          - {os: ubuntu-22.04, toolset: clang,     cxxstd: 14, boostBranch: boost-1.63.0}
          - {os: ubuntu-22.04, toolset: clang,     cxxstd: 14, boostBranch: master}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        if: startsWith(matrix.os, 'ubuntu')
        with:
          key: ${{matrix.os}}-${{matrix.toolset}}-${{matrix.boostBranch}}

      # Checking out Boost and all its submodules takes ages, so warmup by caching the whole thing
      - name: Cache Boost
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: boost-root
          key: boost-${{matrix.boostBranch}}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: boostorg/boost
          ref: ${{ matrix.boostBranch }}
          submodules: true
          path: boost-root
          persist-credentials: false
      - name: Build Boost
        working-directory: boost-root
        run: |
          echo "BOOST_ROOT=$PWD" >> $GITHUB_ENV
          echo "::group::Bootstrap"
          ./bootstrap.sh && ./b2 headers
          echo "::endgroup::"
          echo "::group::Build required Boost libs"
          ./b2 toolset=${{matrix.toolset}} address-model=64 --with-test --with-thread --with-chrono --with-atomic --with-date_time -a -j3
          echo "::endgroup::"
          echo "LD_LIBRARY_PATH=$PWD/stage/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Print bootstrap.log
        if: ${{ failure() }}
        working-directory: boost-root
        run: cat bootstrap.log

      - name: CMake build
        run: |
          if [[ "${{ matrix.generator }}" == "MinGW"* ]]; then
            # GHA has 2 MinGWs installed which must not be mixed,
            # so make sure the executables pick up the libraries/DLLs matching the compiler
            gcc_folder=$(dirname "$(which g++)")
            prefix=${gcc_folder%/bin}
            export PATH="$prefix/bin:$prefix/lib:$PATH"
          fi
          mkdir build && cd build
          extra_args=(-DBoost_ROOT="$BOOST_ROOT/stage" -DBoost_DEBUG=ON -DBoost_VERBOSE=ON)
          if [[ -n "${{matrix.generator}}" ]]; then
            extra_args+=(-G "${{matrix.generator}}")
          fi
          if [[ -n "${{matrix.cxxstd}}" ]]; then
            extra_args+=(-DCMAKE_CXX_STANDARD=${{matrix.cxxstd}})
          fi
          if [[ "$Linux" == "Ubuntu"* ]]; then
            extra_args+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          echo "CMake args: ${extra_args[@]}"
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_VERBOSE_MAKEFILE=ON "${extra_args[@]}"
          cmake --build . --config Debug --parallel 3
          ctest --output-on-failure --build-config Debug

      - name: Cleanup Boost folder to reduce cache usage
        if: ${{ always() }}
        working-directory: boost-root
        run: git clean -fxd
