name: CI


permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - feature/**

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

env:
  NET_RETRY_COUNT: 5
  DOCBOOK_XSL_DIR: /usr/share/xml/docbook/stylesheet/docbook-xsl
  DOCBOOK_DTD_DIR: /usr/share/xml/docbook/schema/dtd/4.2

jobs:
  Formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Formatting
      uses: DoozyX/clang-format-lint-action@bcb4eb2cb0d707ee4f3e5cc3b456eb075f12cf73 # v0.20
      with:
        clangFormatVersion: 10

  call-boost-ci:
    name: Run Build
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    with:
      library_folder: turtle
      b2_targets: "libs/turtle/test libs/turtle/doc//mock_examples"
      branch_coverage: false
      coverage_service: coveralls
      enable_cmake: false
      enable_32bit: false
      enable_multiarch: false
      enable_reflection: false
      exclude_compiler: gcc-4.4,gcc-4.6,gcc-4.7,gcc-4.8,gcc-4.9,gcc-5,gcc-6,clang-3.5,clang-3.6,clang-3.7,clang-3.8,clang-3.9,clang-4.0,clang-5.0,clang-6.0
      exclude_cxxstd: 98,03,0x,11

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: boostorg/boost
        ref: master
        path: boost-root
        submodules: false
    - name: Install packages
      run: sudo apt-get -o Acquire::Retries=3 install -y xsltproc docbook-xsl docbook-xml
    - name: Init submodules for doc build
      working-directory: boost-root
      run: |
        git submodule update -q --init tools/boostdep tools/boostbook tools/quickbook tools/inspect
        python tools/boostdep/depinst/depinst.py ../tools/boostbook
        python tools/boostdep/depinst/depinst.py ../tools/quickbook
        python tools/boostdep/depinst/depinst.py ../tools/inspect
    - name: Bootstrap b2
      working-directory: boost-root
      run: ./bootstrap.sh
    - name: Build doc
      run: scripts/build_doc.sh
      env:
        BOOST_ROOT: ${{ github.workspace }}/boost-root
    - name: Build and run inspect
      working-directory: boost-root
      run: ./b2 "$GITHUB_WORKSPACE/test//inspect" -q
